name: PointArrow CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Дозволяє за потреби запускати збірку вручну кнопкою

jobs:
  build:
    name: Build & Verify Release APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Make gradlew executable
      run: chmod +x gradlew

    # 1. Автоматично генеруємо ключ підпису безпосередньо в хмарі GitHub
    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias releaseAlias -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=App, OU=Dev, O=AI, L=Kyiv, S=UA, C=UA" -storepass "MyPassword123" -keypass "MyPassword123"

    # 2. Запускаємо тести перед збіркою, щоб переконатися, що все працює
    - name: Run Unit Tests
      run: ./gradlew testReleaseUnitTest

    # 3. Збираємо та підписуємо релізний APK, повністю ігноруючи проблемний лінтер (-x lintVitalRelease)
    - name: Build Signed Release APK with Gradle
      run: ./gradlew assembleRelease --stacktrace -x lintVitalRelease
      env:
        GRADLE_OPTS: "-Dorg.gradle.project.signingKeyStore=../release.keystore -Dorg.gradle.project.signingStorePassword=MyPassword123 -Dorg.gradle.project.signingKeyAlias=releaseAlias -Dorg.gradle.project.signingKeyPassword=MyPassword123"

    # 4. Вивантажуємо готовий релізний файл для скачування
    - name: Upload Signed Release APK
      uses: actions/upload-artifact@v4
      with:
        name: pointarrow-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
